name: CI

on:
  pull_request:
  push:
    branches: [ main, feature/prototype ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Keep this version in step with the dev extra in pyproject.toml.
      - name: Install Ruff
        run: python -m pip install "ruff==0.17.2"

      # Rules come from [tool.ruff.lint] in pyproject.toml.
      - name: Run Ruff
        run: ruff check --output-format=github .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The mcp extra lets the MCP server tests run instead of skipping, once the
      # extra pins an mcp 1.x that still ships mcp.server.fastmcp.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run tests
        run: python -m pytest tests/ -ra
