[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radical.adl"
version = "0.1.0"
description = "Agentic Adaptive Decision Layer for AsyncFlow"
authors = [
    {name = "Aymen Alsaadi", email = "aymen.alsaadi@rutgers.edu"},
    {name = "RADICAL Lab"},
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "radical.asyncflow",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radical.adl" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
